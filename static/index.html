<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agentic Triage Starter</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <style>[x-cloak]{display:none!important}body{background:#020617;color:#e2e8f0;font-family:system-ui,sans-serif}.panel{background:#0f172a;border:1px solid #334155;border-radius:12px;padding:16px}.row{display:block;width:100%;text-align:left;border-bottom:1px solid #334155;padding:8px}.row:hover,.selected{background:#1e293b}.btn{background:#1e293b;border:1px solid #64748b;border-radius:6px;padding:6px 10px}.link{color:#67e8f9;text-decoration:underline}.scroll{max-height:240px;overflow:auto}.detail{border-top:1px solid #334155;margin-top:12px;padding-top:12px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}</style>
</head>
<body x-data="triageApp()" x-init="load()" x-cloak>
  <header class="p-4 border-b border-slate-700 flex flex-wrap gap-3 items-center">
    <div class="mr-auto"><h1 class="text-xl font-bold">Agentic Triage Starter</h1><p class="text-sm text-slate-400">Generic scaffold · no challenge policy configured</p></div>
    <label class="btn cursor-pointer">Replay JSONL<input class="hidden" type="file" accept=".jsonl" @change="importJsonl($event)"></label>
    <button class="btn" @click="reset()">Reset</button>
  </header>
  <main class="p-4 max-w-screen-2xl mx-auto">
    <p class="text-sm text-amber-300 mb-3" x-text="message || `${reports.length} reports · ${incidents.length} incidents · ${decisions.length} decisions`"></p>
    <div class="grid lg:grid-cols-2 gap-4">
      <section class="panel"><h2 class="font-bold mb-2">Raw reports</h2>
        <div class="scroll"><template x-for="report in reports" :key="report.report_id"><button class="row" :class="selectedReport===report.report_id&&'selected'" @click="selectReport(report.report_id)"><span class="font-mono text-cyan-300" x-text="report.report_id"></span> <span x-text="report.payload"></span></button></template></div>
        <template x-if="activeReport()"><div class="detail"><h3 class="font-semibold">Report <span x-text="selectedReport"></span></h3><pre x-text="JSON.stringify(activeReport(),null,2)"></pre><button class="link" x-show="activeDecision()" @click="selectIncident(activeDecision().incident_id)">Open linked incident →</button></div></template>
        <div class="detail"><h3 class="font-semibold mb-2">Try one report</h3><input class="bg-slate-800 p-2 rounded w-full mb-2" placeholder="Source" x-model="draftSource"><textarea class="bg-slate-800 p-2 rounded w-full" placeholder="Payload" x-model="draftPayload"></textarea><button class="btn mt-2" @click="submit()">Ingest</button></div>
      </section>
      <section class="panel"><h2 class="font-bold mb-2">Incident masters</h2>
        <div class="scroll"><template x-for="incident in incidents" :key="incident.incident_id"><button class="row" :class="selectedIncident===incident.incident_id&&'selected'" @click="selectIncident(incident.incident_id)"><span class="font-mono text-emerald-300" x-text="incident.incident_id"></span> <span x-text="incident.status + ' · ' + incident.summary"></span></button></template></div>
        <template x-if="activeIncident()"><div class="detail"><h3 class="font-semibold">Incident <span x-text="selectedIncident"></span></h3><p x-text="activeIncident().status + ' · ' + activeIncident().severity + ' · confidence ' + activeIncident().confidence"></p><p class="mt-2 text-sm">Linked reports:</p><template x-for="id in activeIncident().report_ids" :key="id"><button class="link mr-2" @click="selectReport(id)" x-text="id"></button></template></div></template>
      </section>
      <section class="panel"><h2 class="font-bold mb-2">Decisions and reasoning</h2>
        <div class="scroll"><template x-for="decision in decisions" :key="decision.report_id"><button class="row" :class="selectedReport===decision.report_id&&'selected'" @click="selectDecision(decision)"><span class="text-cyan-300" x-text="decision.report_id"></span> → <span class="text-emerald-300" x-text="decision.incident_id"></span> <span x-text="decision.relationship + ' · ' + decision.status"></span></button></template></div>
        <template x-if="activeDecision()"><div class="detail"><h3 class="font-semibold">Trace</h3><ol class="list-decimal ml-5 text-sm"><template x-for="line in activeDecision().trace"><li x-text="line"></li></template></ol><p class="mt-2" x-show="activeDecision().proposed_action">Proposed action: <span x-text="activeDecision().proposed_action?.type"></span></p><button class="link" @click="selectReport(activeDecision().report_id)">Open raw report</button> · <button class="link" @click="selectIncident(activeDecision().incident_id)">Open incident</button></div></template>
      </section>
      <section class="panel"><h2 class="font-bold mb-2">Action proposals and review</h2>
        <p class="text-sm text-slate-400 mb-2">Action proposals are recorded only; no external executor is connected.</p>
        <div class="scroll"><template x-for="decision in decisions.filter(item=>item.proposed_action)" :key="decision.report_id"><div class="row"><button class="link" @click="selectDecision(decision)" x-text="decision.proposed_action.type + ' · ' + decision.proposed_action.service"></button><button class="link ml-2" @click="selectReport(decision.report_id)" x-text="decision.report_id"></button> → <button class="link" @click="selectIncident(decision.incident_id)" x-text="decision.incident_id"></button></div></template></div>
        <h3 class="font-semibold mt-3">Review queue</h3>
        <div class="scroll"><template x-for="review in reviews" :key="review.review_id"><div class="row"><button class="link" @click="selectReport(review.report_id)" x-text="review.review_id + ' · ' + review.report_id"></button><p x-text="review.reason"></p><p class="text-sm" x-text="review.status"></p><p x-show="review.proposed_action" x-text="review.proposed_action?.type"></p><div x-show="review.status==='PENDING'" class="flex gap-2 mt-2"><button class="btn" @click="decide(review.review_id,true)">Approve for manual handling</button><button class="btn" @click="decide(review.review_id,false)">Reject</button></div></div></template></div>
      </section>
    </div>
  </main>
  <script>
    function triageApp(){return{
      reports:[],incidents:[],decisions:[],reviews:[],selectedReport:null,selectedIncident:null,message:'',draftSource:'',draftPayload:'',
      async request(path,options={}){const response=await fetch('/api/'+path,{headers:{'Content-Type':'application/json'},...options});const data=await response.json();if(!response.ok)throw Error(data.detail||response.statusText);return data},
      async load(){try{const state=await this.request('state');Object.assign(this,state);this.message=''}catch(error){this.message=error.message}},
      activeReport(){return this.reports.find(x=>x.report_id===this.selectedReport)},
      activeIncident(){return this.incidents.find(x=>x.incident_id===this.selectedIncident)},
      activeDecision(){return this.decisions.find(x=>x.report_id===this.selectedReport)},
      selectReport(id){this.selectedReport=id;const decision=this.activeDecision();if(decision)this.selectedIncident=decision.incident_id},
      selectIncident(id){this.selectedIncident=id;const incident=this.activeIncident();if(incident?.report_ids.length)this.selectedReport=incident.report_ids.at(-1)},
      selectDecision(decision){this.selectedReport=decision.report_id;this.selectedIncident=decision.incident_id},
      async submit(){if(!this.draftPayload.trim()){this.message='Enter a payload';return}try{const id='R'+Date.now();const report={report_id:id,timestamp:new Date().toISOString(),source:this.draftSource,payload:this.draftPayload};await this.request('reports',{method:'POST',body:JSON.stringify(report)});this.draftPayload='';await this.load();this.selectReport(id)}catch(error){this.message=error.message}},
      async importJsonl(event){try{const text=await event.target.files[0].text();const reports=text.split(/\r?\n/).filter(Boolean).map(line=>JSON.parse(line));await this.request('replay',{method:'POST',body:JSON.stringify(reports)});await this.load();if(reports.length)this.selectReport(reports[0].report_id)}catch(error){this.message=error.message}event.target.value=''},
      async decide(id,approved){try{await this.request('reviews/'+id+'/decision',{method:'POST',body:JSON.stringify({approved})});await this.load()}catch(error){this.message=error.message}},
      async reset(){await this.request('reset',{method:'POST'});this.selectedReport=null;this.selectedIncident=null;await this.load()}
    }}
  </script>
</body>
</html>
